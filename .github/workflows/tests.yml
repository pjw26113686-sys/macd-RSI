name: tests

# push / PR 마다 전체 테스트(미래참조 게이트 포함)를 강제한다.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (pyflakes — 미사용/미정의 정적 점검)
        run: |
          pip install pyflakes
          python -m pyflakes src/ tests/

      - name: Run tests
        run: pytest -q

      - name: Smoke — 검증 CLI (합성 데이터, 네트워크 불필요)
        run: |
          python -m src.validate --synthetic --bars 1200 --blocks 10 --folds 3 --no-wfa
          python -m src.strategy_check --category momentum --synthetic --bars 1200 --no-perf
