# 해외선물 프랍 다전략 비교 백테스트 설정
# 전략 파라미터는 "정답"이 아니라 출발값이다(추후 grid search).

# 전략별 파라미터 오버라이드 (없으면 각 전략의 default_params 사용)
strategies:
  ma_cross:
    fast_ma: 20
    slow_ma: 50
    swing_lookback_M: 10
    stop_buffer: 0.001
    reward_ratio: 2.0
  bollinger:
    bb_period: 20
    bb_std: 2.0
    swing_lookback_M: 10
    stop_buffer: 0.001

# 포지션 사이징 (mode: fixed | risk)
sizing:
  mode: fixed
  contracts: 1          # mode=fixed: 항상 N계약
  risk_dollars: 250     # mode=risk: 거래당 손절폭 리스크($)
  max_contracts: 10     # mode=risk 상한

# 프랍 룰셋 (src/prop/rules.py 프리셋명)
prop:
  ruleset: apex_50k     # apex_25k/50k/100k/150k, topstep_50k

# 데이터 (합성 우선; 실데이터는 synthetic:false + path_template)
data:
  futures:
    synthetic: true
    timeframe: "5m"
    n_bars: 8000
    seed: 0
    drift: 0.0
    vol_ticks: 8.0
    path_template: "data/futures/{symbol}_{tf}.csv"

# 비교 대상 (비우면 등록된 모든 전략 × 아래 상품)
compare:
  strategies: [ma_cross, bollinger]
  instruments: [NQ, ES, MNQ]
