# 전략 파라미터 + 시장별 비용 (strategy_spec_v2.md §1, §5)
# 이 값들은 "정답"이 아니라 grid search 시작점이다 (2차에서 시장별 스윕).

strategy:
  # MACD
  macd_fast: 12          # 스윕: 8, 12
  macd_slow: 26          # 스윕: 21, 26
  macd_signal: 9         # 스윕: 7, 9
  # RSI (Wilder)
  rsi_period: 14         # 스윕: 7, 9, 14
  rsi_entry_low: 50      # 스윕: 45, 50
  rsi_entry_high: 70     # 스윕: 65, 70, 75
  rsi_support_band: 5    # "50 부근" = 50 +/- band. 스윕: 3, 5, 8
  # 추세 / 거래량 필터 (모멘텀스코프)
  hma_period: 100        # 스윕: 50, 100
  vol_ma_period: 20
  vol_ma_mult: 1.0
  # 진입 보조
  delay_window: 5        # 지연진입 유효 봉수. 스윕: 3, 5, 10
  min_body_ratio: 0.5    # 양봉 최소 몸통비율 (close-open)/(high-low). 스윕: 0.3, 0.5
  # 청산
  swing_lookback_M: 10   # 손절 전저점 탐색 봉수. 스윕: 5, 10, 20
  stop_buffer: 0.001     # 손절가 노이즈 여유 (swing_low * (1 - buffer))
  reward_ratio: 2.0      # 손익비 1:2

# 시장별 비용 (편도). 진입가=open*(1+slip), 청산가=exit*(1-slip), 양변 수수료 차감.
costs:
  crypto:
    fee: 0.0010          # 0.10% 테이커
    slippage: 0.0010     # 0.10%
    sell_tax: 0.0
  stock:
    fee: 0.0000          # 무료수수료 가정 (규제수수료 미세)
    slippage: 0.0005     # 0.05%
    sell_tax: 0.0

# 데이터 소스 / 백테스트 대상
data:
  crypto:
    exchange: binance
    symbol: BTC/USDT
    timeframe: 1h
    since: "2020-01-01T00:00:00Z"
  stock:
    symbol: AAPL
    interval: 60m
    period: 730d         # yfinance 60m 최대 730일
    auto_adjust: true

backtest:
  initial_capital: 10000
  # 명목 상한(자본 대비). 어떤 사이저도 이 비중을 넘지 않는다.
  position_pct: 1.0
  # 포지션 사이징 (src/engine/sizing.py):
  #   fixed_fraction : 자본의 position_pct를 명목으로 (기본, 기존 동작)
  #   fixed_risk     : 손절까지 손실이 자본의 risk_pct가 되도록 (기관식 리스크 사이징)
  sizing: fixed_fraction
  risk_pct: 0.01           # fixed_risk에서 거래당 감수 리스크 (1%)
