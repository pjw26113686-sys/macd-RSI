[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "macd-rsi-backtest"
version = "0.1.0"
description = "MACD+RSI momentum strategy — phase-1 single-symbol backtest (BTC/USDT, AAPL)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pyarrow>=12.0",
    "ccxt>=4.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
